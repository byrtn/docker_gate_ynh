#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "docker_gate"
name = "Docker Gate"
description.en = "Install Docker and expose containers behind YunoHost's SSO with one click"
description.fr = "Installe Docker et expose des conteneurs derrière le SSO de YunoHost en un clic"

version = "1.4.0~ynh1"

maintainers = ["byrtn"]

[upstream]
license = "AGPL-3.0-or-later"
code = "https://github.com/byrtn/docker_gate_ynh"

[integration]
yunohost = ">= 12.0.0"
helpers_version = "2.0"
architectures = ["amd64", "arm64"]
# Multi-instance since 2026-07-31 (DEC-134): Patrick wants Docker Gate
# installable several times on the same server, on different domains,
# without one instance ever colliding with or interfering with another.
# Every Docker resource an instance creates (container/volume/network
# names) is now prefixed with this instance's own YunoHost app id (see
# YNH_APP_ID/RESOURCE_PREFIX in ynh_manager.py and conf/systemd.service) —
# the shared Docker daemon itself has no notion of "instance", so this
# had to be built explicitly rather than assumed for free.
multi_instance = true

ldap = "not_relevant"
sso = false

disk = "200M"
ram.build = "100M"
ram.runtime = "150M"

[install]
    [install.domain]
    # generic question — the text is handled by YunoHost core, not customizable
    type = "domain"

    [install.path]
    # generic question — the text is handled by YunoHost core, not customizable
    type = "path"
    default = "/docker-gate"

    [install.init_main_permission]
    # also a generic question (confirmed: the displayed text was YunoHost's
    # standard text, not ours) — only the help text is customizable
    #
    # "admins" since 2026-07-31 (was "visitors" since 2026-07-27, itself
    # reverted from "admins"): Docker Gate is an admin-only tool by design —
    # it must never be reachable by an unauthenticated visitor or a non-admin
    # account, not even indirectly via its own login page. The 2026-07-27
    # experiment (public "main" permission + access control done INSIDE
    # app.py via portalapi/me) was meant to work around a broken YunoHost
    # post-login deep-link redirect (see DECISIONS.md DEC-096), but it
    # violated the actual product requirement and YunoHost's own convention
    # for admin-only apps (native permission group, not an app-level gate).
    # Reverted: SSOwat now blocks any non-admin before the request ever
    # reaches this app, exactly like before DEC-096 — see DECISIONS.md
    # DEC-133 for the full trace, including how a possible regression of the
    # deep-link redirect bug was a deliberate, accepted trade-off.
    type = "group"
    default = "admins"
    help.en = "Docker Gate is an administration tool: only members of the admins group can access it."
    help.fr = "Docker Gate est un outil d'administration : seuls les membres du groupe admins peuvent y accéder."

    [install.default_language]
    # Default interface language (2026-07-15, i18n) — stays changeable at
    # any time from the interface itself (EN/FR switcher at the top of
    # every page), this setting only chooses the starting point.
    type = "select"
    choices = ["en", "fr"]
    default = "en"
    ask.en = "Default interface language (changeable anytime from the app itself)"
    ask.fr = "Langue par défaut de l'interface (modifiable à tout moment depuis l'app elle-même)"

[resources]
    [resources.apt]
    packages = "python3-venv, python3-pip"

    [resources.system_user]

    [resources.install_dir]
    dir = "/opt/yunohost/__APP__"

    [resources.permissions]
    main.url = "/"
    # Never shown as a portal tile — Docker Gate is an admin-only tool,
    # reached directly by URL, not meant to appear next to regular apps.
    main.show_tile = false
    # Prevents this permission from ever being accidentally opened to
    # "visitors"/"all_users" later (webadmin or CLI) — a deliberate safety
    # net now that admin-only access is enforced by SSOwat itself (see
    # [install.init_main_permission] above and DECISIONS.md DEC-133).
    main.protected = true
    # No longer needed: app.py doesn't relay any Basic-Auth header to a
    # portal API anymore (removed with the DEC-096 D1 internal auth gate,
    # see DECISIONS.md DEC-133) — SSOwat's own admins-only gate is now the
    # single source of truth for access control.
    main.auth_header = false

    [resources.ports]
    main.default = 9200
