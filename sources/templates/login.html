{% extends "base.html" %}

{% block title %}{{ t('title_login') }} — Docker Gate{% endblock %}

{% block content %}
<style>
  /* Permission "main" publique depuis le 27/07/2026 (DEC-096 D1) : cette
     page s'affiche à tout visiteur non authentifié, l'accès admin réel est
     vérifié en interne (voir _check_auth dans app.py) — même pattern que
     wappos_portail_ynh (DEC-072). */
  .login-center { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem 0; }
  .login-page { width: 100%; max-width: 300px; }
  .login-form-grid { display: grid; grid-template-columns: 1.5rem 1fr; column-gap: 0.6rem; row-gap: 1rem; align-items: center; }
  .login-form-grid svg { color: var(--color-text-dim); }
  .login-field-input { position: relative; }
  .login-field-input input {
    width: 100%; padding: 0.6rem 0.75rem; border-radius: 8px;
    border: 1px solid var(--color-border); background: var(--color-bg-pure); color: var(--color-text);
    font-size: 0.95rem; font-family: inherit;
  }
  .login-field-input input:focus { outline: none; border-color: var(--color-primary); }
  .login-field-input.password input { padding-right: 4.5rem; }
  .toggle-password {
    position: absolute; right: 0.5rem; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; font-size: 0.8rem; padding: 0.25rem 0.4rem;
    color: var(--color-text-dim); text-decoration: underline; font-family: inherit;
  }
  .login-submit {
    grid-column: 2; padding: 0.65rem 1.25rem; border-radius: var(--radius-btn); border: none;
    background: var(--color-accent); color: #fff; cursor: pointer; font-size: 0.95rem; font-weight: 600;
  }
  .login-submit:hover { background: #b8230f; }
</style>

<div class="login-center">
  <div class="login-page">
    <div id="login-error" class="flash flash-error" style="display:none;"></div>

    <!-- method="post" + onsubmit="return false" : filet de sécurité en dur,
         indépendant du JS ci-dessous — un submit natif ne doit jamais
         finir en GET avec le mot de passe dans l'URL. -->
    <form id="login-form" method="post" action="javascript:void(0)" onsubmit="return false;" class="login-form-grid">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"><path fill="currentColor" d="M12 19.2c-2.5 0-4.71-1.28-6-3.2c.03-2 4-3.1 6-3.1s5.97 1.1 6 3.1a7.232 7.232 0 0 1-6 3.2M12 5a3 3 0 0 1 3 3a3 3 0 0 1-3 3a3 3 0 0 1-3-3a3 3 0 0 1 3-3m0-3A10 10 0 0 0 2 12a10 10 0 0 0 10 10a10 10 0 0 0 10-10c0-5.53-4.5-10-10-10Z"/></svg>
      <div class="login-field-input">
        <label for="username" class="sr-only">{{ t('username_label') }}</label>
        <input type="text" id="username" name="username" placeholder="{{ t('username_placeholder') }}"
               autocomplete="username" autocapitalize="off" spellcheck="false" required autofocus>
      </div>

      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"><path fill="currentColor" d="M12 17a2 2 0 0 0 2-2a2 2 0 0 0-2-2a2 2 0 0 0-2 2a2 2 0 0 0 2 2m6-9a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V10a2 2 0 0 1 2-2h1V6a5 5 0 0 1 5-5a5 5 0 0 1 5 5v2h1m-6-5a3 3 0 0 0-3 3v2h6V6a3 3 0 0 0-3-3Z"/></svg>
      <div class="login-field-input password">
        <label for="password" class="sr-only">{{ t('password_label') }}</label>
        <input type="password" id="password" name="password" placeholder="{{ t('password_placeholder') }}"
               autocomplete="current-password" required>
        <button type="button" class="toggle-password" data-target="password">{{ t('toggle_password_show') }}</button>
      </div>

      <button type="submit" class="login-submit">{{ t('btn_login') }}</button>
    </form>
  </div>
</div>

<script>
  const I18N = {
    toggleShow: {{ t('toggle_password_show')|tojson }},
    toggleHide: {{ t('toggle_password_hide')|tojson }},
    errBadCredentials: {{ t('err_bad_credentials')|tojson }},
    errServerUnreachable: {{ t('err_server_unreachable')|tojson }},
  };

  document.querySelectorAll('.toggle-password').forEach((btn) => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.target);
      const showing = input.type === 'password';
      input.type = showing ? 'text' : 'password';
      btn.textContent = showing ? I18N.toggleHide : I18N.toggleShow;
    });
  });

  // Même mécanisme que wappos_portail_ynh (DEC-072) : on délègue entièrement
  // la vérification du mot de passe à l'API publique du portail YunoHost
  // (/yunohost/portalapi/login), jamais à nous-mêmes. Un succès pose le
  // vrai cookie de session SSOwat dans le navigateur ; il ne reste plus
  // qu'à recharger la page pour que SSOwat injecte l'en-tête Authorization
  // et que "/" affiche la liste des apps (après vérification interne du
  // groupe admins, voir _check_auth dans app.py).
  const form = document.getElementById('login-form');
  const errorBox = document.getElementById('login-error');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';

    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;

    try {
      const resp = await fetch('/yunohost/portalapi/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ credentials: `${username}:${password}` }),
      });
      if (resp.ok) {
        window.location.reload();
      } else {
        errorBox.textContent = I18N.errBadCredentials;
        errorBox.style.display = 'block';
      }
    } catch (err) {
      errorBox.textContent = I18N.errServerUnreachable;
      errorBox.style.display = 'block';
    }
  });
</script>
{% endblock %}
